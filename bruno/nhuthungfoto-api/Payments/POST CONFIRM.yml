info:
  name: POST CONFIRM
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:8787/v1/payments/{{orderId}}/confirm
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        const data = res.getBody();
        expect(data.id).to.equal(bru.getVar("orderId"));
        expect(data.status).to.equal("AWAITING_REVIEW");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
