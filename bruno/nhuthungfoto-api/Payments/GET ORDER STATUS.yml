info:
  name: GET ORDER STATUS
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8787/v1/payments/{{orderId}}/status
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        const data = res.getBody();
        expect(data.id).to.equal(bru.getVar("orderId"));
        expect(["PENDING_TRANSFER", "AWAITING_REVIEW", "SUCCESS", "CANCELLED", "EXPIRED"]).to.include(data.status);
        expect(data.qrUrl).to.include("https");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
