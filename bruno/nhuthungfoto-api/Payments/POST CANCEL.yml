info:
  name: POST CANCEL
  type: http
  seq: 8

http:
  method: POST
  url: http://localhost:8787/v1/payments/{{orderId}}/cancel
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        const data = res.getBody();
        expect(data.id).to.equal(bru.getVar("orderId"));
        expect(["CANCELLED", "EXPIRED"]).to.include(data.status);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
