info:
  name: POST CREATE ORDER - IDEMPOTENT
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8787/v1/payments
  auth: inherit
  body:
    type: json
    data: |-
      {
        "packageId": "practice",
        "clientRequestId": "{{clientRequestId}}"
      }

runtime:
  scripts:
    - type: pre-request
      code: |-
        // No fresh key — re-send the SAME key as POST CREATE ORDER.
        if (!bru.getVar("clientRequestId")) {
          bru.setVar("clientRequestId", "bruno-fallback");
        }
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        expect(res.getBody().id).to.equal(bru.getVar("orderId"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
