info:
  name: POST WEBHOOK APPROVE
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8787/v1/telegram/webhook
  auth: none
  headers:
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "{{TELEGRAM_WEBHOOK_SECRET}}"
  body:
    type: json
    # Simulates Telegram callback_query from admin pressing "✅ Duyệt".
    # Requires {{orderId}} to be set (run POST CREATE ORDER + POST CONFIRM first).
    data: |-
      {
        "callback_query": {
          "id": "bruno-cb-approve-001",
          "from": { "id": 123456789 },
          "message": {
            "message_id": 999,
            "chat": { "id": {{TELEGRAM_CHAT_ID}} }
          },
          "data": "approve:{{orderId}}"
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(200);
        const data = res.getBody();
        expect(data.ok).to.equal(true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
