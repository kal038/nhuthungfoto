info:
  name: POST WEBHOOK - UNAUTHORIZED
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8787/v1/telegram/webhook
  auth: none
  headers:
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "wrong-secret"
  body:
    type: json
    data: |-
      {
        "callback_query": {
          "id": "bruno-cb-unauth-001",
          "from": { "id": 123456789 },
          "message": {
            "message_id": 999,
            "chat": { "id": {{TELEGRAM_CHAT_ID}} }
          },
          "data": "approve:00000000-0000-0000-0000-000000000000"
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.getStatus()).to.equal(401);
        const data = res.getBody();
        expect(data.error).to.equal("Unauthorized");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
