info:
  name: POST WEBHOOK - ORDER NOT FOUND
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:8787/v1/telegram/webhook
  auth: none
  headers:
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "{{TELEGRAM_WEBHOOK_SECRET}}"
  body:
    type: json
    # Approve a non-existent order — the RPC returns 404, webhook answers
    # the callback with a toast and still returns 200 to Telegram.
    data: |-
      {
        "callback_query": {
          "id": "bruno-cb-notfound-001",
          "from": { "id": 123456789 },
          "message": {
            "message_id": 999,
            "chat": { "id": {{TELEGRAM_CHAT_ID}} }
          },
          "data": "approve:00000000-0000-0000-0000-000000000000"
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Webhook still returns 200 to Telegram (AppError 404 is caught internally).
        expect(res.getStatus()).to.equal(200);
        const data = res.getBody();
        expect(data.ok).to.equal(true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
